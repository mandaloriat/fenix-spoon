name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e "./server[dev]"
      - name: Lint
        run: ruff check server
      - name: Test (mock path, no FEniCSx)
        run: pytest server/tests -v

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The integration tests boot a real server; without the Python package they
      # would silently skip, so install it here and keep them honest.
      - name: Install server
        run: pip install -e ./server
      # Deliberately `ci`, not `install`: a lockfile that has drifted from
      # package.json should fail the build, not be silently regenerated.
      - name: Install client
        run: npm ci --prefix client
      - name: Typecheck
        run: npm run typecheck --prefix client
      - name: Test
        run: npm test --prefix client
      - name: Build
        run: npm run build --prefix client
      # Gestures need a real browser: layout, a real canvas, and pointer events the
      # renderer synthesises rather than the test constructing them. The harness drives
      # the runner image's Chrome over CDP — no Playwright, so no browser download on
      # every `npm ci` in a package whose selling point is a small embed footprint.
      - name: Guard against a silently skipped browser suite
        # Same reasoning as the fenics and redis jobs: a skip here would look like a pass.
        run: test -x /usr/bin/google-chrome || test -x /usr/bin/chromium
      - name: Test (browser gestures)
        run: npm run test:browser --prefix client --workspace @fenix-spoon/viewer

  fenics:
    runs-on: ubuntu-latest
    container:
      # Pinned for reproducibility; bump deliberately when a new dolfinx releases and
      # the adapter has been checked against it (see solvers/dolfinx_poisson.py).
      image: dolfinx/dolfinx:v0.11.0
    env:
      PIP_BREAK_SYSTEM_PACKAGES: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: pip install -e "./server[dev]"
      - name: Guard against silently skipped tests
        # The adapter tests importorskip these; fail loudly if the image lacks them.
        run: python3 -c "import dolfinx, gmsh"
      - name: Test (FEniCSx adapter)
        run: pytest server/tests -m fenics -v

  # The protocol reference is generated from the pydantic models and committed. This job
  # is what makes "the docs cannot drift from the code" true rather than aspirational:
  # change a field without regenerating and the build goes red, with the diff to prove it.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e "./server[docs]"
      - name: Protocol reference is up to date with the models
        run: |
          python server/tools/generate_protocol_reference.py --check \
            || { git --no-pager diff -- docs/reference-protocol.md; exit 1; }
      # `strict: true` in mkdocs.yml, so a broken internal link fails here. A docs site
      # whose links 404 is worse than no docs site.
      - name: Build the site
        run: mkdocs build

  # The distributed job backend. These tests skip themselves without a reachable Redis,
  # so without this job the entire worker path — pub/sub, the queue, the worker entry
  # point — would be covered by tests that never run.
  redis:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e "./server[dev,redis]"
      - name: Guard against silently skipped tests
        # Same reasoning as the fenics job: a skip here would look like a pass.
        run: python3 -c "import arq, redis"
      - name: Test (Redis backend and workers)
        env:
          FENIXSPOON_TEST_REDIS_URL: redis://localhost:6379
        run: pytest server/tests -m redis -v
