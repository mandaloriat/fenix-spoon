[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fenixspoon"
version = "0.1.0"
description = "Server toolkit for building FEniCSx-powered web applications"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "numpy>=1.26",
    "pydantic>=2.6",
    # RFC 6902 patches for workspace objects (roadmap M2.5, #44). A base dependency rather
    # than an extra: `object.patch` is a core operation, and an optional import would turn
    # a missing package into a runtime failure on an operation the core advertises. Small
    # and pure-Python, and the spec has enough corners — `~0`/`~1` escaping, the `-` array
    # index, `test` semantics — that a hand-rolled subset would be a subset pretending
    # otherwise.
    "jsonpatch>=1.33",
]

[project.scripts]
# The entry point the JSON-RPC transport documents (roadmap M2.5, #45). `python -m
# fenixspoon` runs the same thing, for a caller that would rather name its interpreter than
# trust PATH.
fenix-spoon = "fenixspoon.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.4",
]
# Installed automatically inside the dolfinx Docker image; listed here for
# completeness. `pip install fenixspoon[fenics]` only works where dolfinx
# wheels/conda packages are already present.
fenics = [
    "gmsh",
]
# The distributed job backend: an API that dispatches to worker processes.
redis = [
    "arq>=0.26",
]
# The Model Context Protocol adapter (roadmap M2.5, #49). An extra rather than a base
# dependency, and that is a requirement of the issue rather than a preference: MCP must not
# become a dependency of the core, so the test suite, the HTTP server and the JSON-RPC
# transport all build and pass without it. `fenixspoon/mcp_adapter.py` is the only module that
# imports it, and `test_nothing_but_the_adapter_imports_mcp` keeps it that way.
mcp = [
    "mcp>=1.0",
]
# Building the documentation site (mkdocs.yml lives at the repository root).
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10",
]

[tool.setuptools.packages.find]
include = ["fenixspoon*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "fenics: tests requiring dolfinx + gmsh (skipped automatically when not installed)",
    "redis: tests requiring a reachable Redis (set FENIXSPOON_TEST_REDIS_URL)",
    "mcp: tests requiring the MCP SDK (skipped automatically when the extra is not installed)",
]
