[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fenixspoon"
version = "0.1.0"
description = "Server toolkit for building FEniCSx-powered web applications"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "numpy>=1.26",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.4",
]
# Installed automatically inside the dolfinx Docker image; listed here for
# completeness. `pip install fenixspoon[fenics]` only works where dolfinx
# wheels/conda packages are already present.
fenics = [
    "gmsh",
]
# The distributed job backend: an API that dispatches to worker processes.
redis = [
    "arq>=0.26",
]

[tool.setuptools.packages.find]
include = ["fenixspoon*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "fenics: tests requiring dolfinx + gmsh (skipped automatically when not installed)",
    "redis: tests requiring a reachable Redis (set FENIXSPOON_TEST_REDIS_URL)",
]
